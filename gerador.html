<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador do data.js - Monta Horário UTFPR</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f1e7; --panel: #fbf8f2; --panel2: #eee6d6; --border: rgba(43,38,32,.10);
    --text: #2b2621; --muted: #83766a; --accent: #8a3324; --accent-hover: #6f2a1e;
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'Work Sans', -apple-system, Helvetica, Arial, sans-serif;
  }
  
  body {
    margin: 0; font-family: var(--font-body); background: var(--bg); color: var(--text); padding: 30px 20px;
  }
  
  .container {
    max-width: 1000px; margin: 0 auto; background: var(--panel); padding: 30px; 
    border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); border: 1px solid var(--border);
  }
  
  h1 { font-family: var(--font-display); color: var(--accent); margin-top: 0; font-size: 26px; }
  h1 span { font-style: italic; }
  p { color: var(--muted); font-size: 14.5px; line-height: 1.5; margin-bottom: 20px; }
  
  textarea {
    width: 100%; height: 220px; padding: 14px; font-family: monospace; font-size: 12.5px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text);
    resize: vertical; box-sizing: border-box; margin-bottom: 20px;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  
  button {
    background: var(--accent); color: #fbf8f2; border: none; padding: 12px 24px; font-size: 14px;
    font-weight: 600; border-radius: 6px; cursor: pointer; transition: 0.2s; font-family: var(--font-body);
  }
  button:hover { background: var(--accent-hover); }
  
  .output-area { margin-top: 30px; display: none; }
  .output-area.show { display: block; }
  
  .header-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .header-controls h2 { font-family: var(--font-display); font-size: 20px; margin: 0; }
  .header-controls button { background: var(--text); padding: 8px 16px; }
  .header-controls button:hover { background: #000; }
  
</style>
</head>
<body>

<div class="container">
  <h1>Monta<span>Horário</span> — Gerador data.js</h1>
  <p>Cole abaixo todo o conteúdo (código-fonte HTML) do relatório "Turmas Abertas" da UTFPR <b>(update1.txt)</b>. O script irá limpar e extrair automaticamente as disciplinas, prioridades e horários para o formato padrão do sistema.</p>

  <textarea id="inputHtml" placeholder="Cole o HTML do update1.txt aqui..."></textarea>
  
  <button onclick="converter()">Gerar data.js</button>

  <div class="output-area" id="outputArea">
    <div class="header-controls">
      <h2>Resultado (data.js)</h2>
      <button onclick="copiar()">Copiar Código</button>
    </div>
    <textarea id="outputJs" readonly></textarea>
  </div>
</div>

<script>
  // Função para limpar conteúdo de células HTML (ex: quebras de linha em professores/prioridades)
  function clearCell(html) {
    let text = html.replace(/<br\s*\/?>/gi, ', ').replace(/&nbsp;/gi, ' '); // Troca <br> por vírgula
    text = text.replace(/<[^>]*>?/gm, ''); // Remove outras tags remanescentes
    text = text.replace(/,\s*$/, '').trim(); // Remove a última vírgula e espaços em branco
    return text;
  }

  function converter() {
    const input = document.getElementById('inputHtml').value;
    const parser = new DOMParser();
    const doc = parser.parseFromString(input, 'text/html');
    
    let result = [];
    let currentSubject = null;

    // Vasculha todas as linhas de tabela do arquivo colado
    const rows = doc.querySelectorAll('table tr');
    
    rows.forEach(row => {
      // 1. Verifica se a linha é de Cabeçalho de Disciplina
      const titleCell = row.querySelector('td.t b');
      if (titleCell) {
        const fullTitle = titleCell.textContent.trim();
        const splitIndex = fullTitle.indexOf(' - ');
        if (splitIndex !== -1) {
          currentSubject = {
            code: fullTitle.substring(0, splitIndex).trim(),
            name: fullTitle.substring(splitIndex + 3).trim(),
            turmas: []
          };
          result.push(currentSubject);
        }
        return;
      }

      // 2. Verifica se a linha contém dados das Turmas (precisa ter as colunas corretas)
      const tds = row.querySelectorAll('td');
      if (tds.length >= 10 && currentSubject) {
        
        // Ignorar o cabeçalho secundário que diz "Turma", "Enquadramento", etc
        if (tds[0].textContent.trim().toLowerCase() === 'turma') return;

        const turma = tds[0].textContent.trim();
        const enq = tds[1].textContent.trim();
        const vt = tds[2].textContent.trim();
        const vc = tds[3].textContent.trim();
        const res = tds[4].textContent.trim();
        
        // Prioridade
        let prio = clearCell(tds[5].innerHTML);
        if (prio === '-' || prio === '') prio = "";

        // Formatando o Horário: removendo espaços envolta dos hifens e preservando asteriscos
        let hRaw = tds[7].textContent.trim();
        let h = hRaw.replace(/\s*-\s*/g, '-').replace(/\s+/g, '');
        
        // Professor e Optativa
        let prof = clearCell(tds[8].innerHTML);
        let opt = clearCell(tds[9].innerHTML);
        if (opt === '-' || opt === '' || opt.toLowerCase() === 'não') {
          opt = 'Não';
        }

        currentSubject.turmas.push({
          turma, enq, vt, vc, res, prio, h, prof, opt
        });
      }
    });

    if (result.length === 0) {
      alert("Nenhuma disciplina encontrada. Verifique se o conteúdo colado é o HTML correto do relatório.");
      return;
    }

    // 3. Montar a string de saída no formato exato original do data.js
    let outputString = `/* ============================================================
   data.js — Dataset de disciplinas e configuração da grade
   Gerado automaticamente pelo conversor de relatórios.
   ============================================================ */\n\nconst DATA = [\n`;

    result.forEach((sub, index) => {
      outputString += `{code:"${sub.code}",name:"${sub.name}",turmas:[\n`;
      sub.turmas.forEach((t, tIndex) => {
        outputString += `{turma:"${t.turma}",enq:"${t.enq}",vt:"${t.vt}",vc:"${t.vc}",res:"${t.res}",prio:"${t.prio}",h:"${t.h}",prof:"${t.prof}",opt:"${t.opt}"}`;
        if (tIndex < sub.turmas.length - 1) outputString += ",\n";
        else outputString += "\n";
      });
      outputString += `]}`;
      if (index < result.length - 1) outputString += ",\n";
      else outputString += "\n";
    });

    outputString += `];\n\n/* ============== CONFIGURAÇÃO DA GRADE DE HORÁRIOS ============== */\n`;
    outputString += `const DAYS = [
  {n:2,label:"Segunda"},{n:3,label:"Terça"},{n:4,label:"Quarta"},
  {n:5,label:"Quinta"},{n:6,label:"Sexta"},{n:7,label:"Sábado"}
];
const AULAS = [
  {code:"M1",turno:"M",start:"07:30",end:"08:20"},
  {code:"M2",turno:"M",start:"08:20",end:"09:10"},
  {code:"M3",turno:"M",start:"09:10",end:"10:00"},
  {code:"M4",turno:"M",start:"10:20",end:"11:10"},
  {code:"M5",turno:"M",start:"11:10",end:"12:00"},
  {code:"M6",turno:"M",start:"12:00",end:"12:50"},
  {code:"T1",turno:"T",start:"13:00",end:"13:50"},
  {code:"T2",turno:"T",start:"13:50",end:"14:40"},
  {code:"T3",turno:"T",start:"14:40",end:"15:30"},
  {code:"T4",turno:"T",start:"15:50",end:"16:40"},
  {code:"T5",turno:"T",start:"16:40",end:"17:30"},
  {code:"T6",turno:"T",start:"17:50",end:"18:40"},
  {code:"N1",turno:"N",start:"18:40",end:"19:30"},
  {code:"N2",turno:"N",start:"19:30",end:"20:20"},
  {code:"N3",turno:"N",start:"20:20",end:"21:10"},
  {code:"N4",turno:"N",start:"21:20",end:"22:10"},
  {code:"N5",turno:"N",start:"22:10",end:"23:00"}
];

/* Paleta de cores expandida e mais variada — sem tons de vermelho,
   para não se confundir com a cor de conflito de horário. */
const PALETTE = [
  "#2c6e49", "#00509d", "#7b2cbf", "#ca6702",
  "#4a4e69", "#006d77", "#606c38", "#023e8a",
  "#386641", "#5a189a", "#457b9d", "#7f4f24",
  "#2a9d8f", "#1d3557", "#6a994e", "#9d4edd",
  "#0081a7", "#5e548e", "#2d6a4f", "#936639",
  "#3c096c", "#0077b6"
];`;

    document.getElementById('outputJs').value = outputString;
    document.getElementById('outputArea').classList.add('show');
  }

  function copiar() {
    const output = document.getElementById('outputJs');
    output.select();
    document.execCommand('copy');
    alert('data.js copiado para a área de transferência! Agora é só colar no arquivo data.js do repositório.');
  }
</script>
</body>
</html>
