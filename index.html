<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monta Horário UTFPR</title>
<meta name="description" content="Gerador interativo de grade horária para cursos da UTFPR. Monte sua grade, evite conflitos de horários e organize seu semestre.">
<link rel="stylesheet" href="styles.css">
<script>
/* Aplica o tema salvo antes da primeira pintura, evitando "flash" de tela clara.
   Fica inline (e não em app.js) de propósito: precisa rodar o mais cedo possível,
   antes do CSS ser aplicado. */
(function(){
  var saved = localStorage.getItem('utfpr_theme') || 'system';
  var isDark = saved === 'dark' || (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
})();
</script>
</head>
<body>

<header>
  <div class="header-title-row">
    <h1>Monta<span>Horário</span> <span id="brandUtfpr">UTFPR 2026/2</span></h1>
    <div class="header-extras">
      <button type="button" class="theme-toggle" id="themeToggle" title="Alternar tema" aria-label="Alternar tema" aria-pressed="false">
        <span class="tt-track">
          <span class="tt-thumb" id="ttThumb"></span>
        </span>
      </button>
      <a class="icon-btn github-link" href="https://github.com/bolsgo/monta-horario-utfpr" target="_blank" rel="noopener noreferrer" title="Ver código no GitHub" aria-label="Ver código no GitHub">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"></path></svg>
      </a>
    </div>
  </div>
</header>
<div class="action-bar" id="actionBar">
  <div class="toolbar">
    <button id="btnUndo" class="icon-btn" title="Desfazer (Ctrl+Z)" aria-label="Desfazer" disabled>
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
    </button>
    <button id="btnRedo" class="icon-btn" title="Refazer (Ctrl+Y)" aria-label="Refazer" disabled>
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
    </button>
    <button id="btnCopy">Copiar Turmas</button>
    <button id="btnPaste">Colar Turmas</button>
    <button id="btnClear" class="danger icon-btn" title="Limpar tudo" aria-label="Limpar tudo">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>
    </button>
  </div>
  <div class="mini-grid" id="miniGrid" aria-hidden="true"></div>
</div>

<main>
  <div class="panel">
    <div class="course-select-wrap sede-select-wrap">
      <label for="sedeSelect">Câmpus</label>
      <select id="sedeSelect" aria-label="Selecionar sede"></select>
    </div>
    <div class="course-select-wrap">
      <label for="courseSelect">Curso</label>
      <select id="courseSelect" aria-label="Selecionar curso"></select>
    </div>
    <label class="visually-hidden" for="searchBox">Buscar disciplina, código, professor ou sigla</label>
    <div class="search-wrap">
      <input class="search" id="searchBox" placeholder="Buscar disciplina, código, professor ou sigla...">
      <button type="button" class="search-clear" id="searchClear" title="Limpar busca" aria-label="Limpar busca" hidden>
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><line x1="5" y1="5" x2="19" y2="19"></line><line x1="19" y1="5" x2="5" y2="19"></line></svg>
      </button>
    </div>    <div class="filter-row" role="group" aria-label="Filtrar disciplinas">
      <button id="filterAll" class="active" aria-pressed="true">Todas</button>
      <button id="filterSelected" aria-pressed="false">Selecionadas</button>
      <button id="filterConflict" aria-pressed="false">Com conflito</button>
    </div>
    <div class="subject-list" id="subjectList" aria-label="Lista de disciplinas"></div>
  </div>

  <div>
    <div class="stats" id="statsBar" role="status" aria-live="polite"></div>
    <div class="conflict-banner" id="conflictBanner" role="alert" aria-live="assertive"></div>
    <div class="grid-wrap">
      <table class="grid" id="gridTable"></table>
    </div>
    <div class="legend" id="legend" aria-label="Legenda de cores por disciplina"></div>
    <div class="footer-note">Dados extraídos do relatório "Turmas Abertas — 2º Semestre de 2026" (UTFPR, gerado 01/08/2026 15:10). Salas em <span class="dot-red">vermelho</span> indicam turmas em outra sede (Ecoville <span class="dot-red">*</span>  / Neoville <span class="dot-red">**</span> ). Sujeito a alteração, confira sempre no sistema oficial. Sem vínculo com a UTFPR.</div>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<!-- Configuração compartilhada por todos os cursos (dias, aulas, paleta) -->
<script src="config.js"></script>
<!-- As disciplinas (DATA) de cada curso são carregadas sob demanda pelo
     próprio app.js, via fetch em data/<slug>.json (ver manifest.json) -->
<!-- Lógica da aplicação (estado, renderização, eventos) -->
<script src="app.js"></script>
</body>
</html>
