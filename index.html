<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monta Horário UTFPR Eng. Elétrica 2026/2</title>
<meta name="description" content="Gerador interativo de grade horária para Engenharia Elétrica da UTFPR. Monte sua grade, evite conflitos de horários e organize seu semestre.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>
/* Aplica o tema salvo antes da primeira pintura, evitando "flash" de tela clara.
   Fica inline (e não em app.js) de propósito: precisa rodar o mais cedo possível,
   antes do CSS ser aplicado. */
(function(){
  var saved = localStorage.getItem('utfpr_theme') || 'system';
  var isDark = saved === 'dark' || (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
})();
</script>
</head>
<body>

<header>
  <h1>Monta<span>Horário</span> Eng. Elétrica UTFPR 2026/2</h1>
  <div class="toolbar">
    <button id="btnUndo" title="Desfazer (Ctrl+Z)" disabled>Desfazer</button>
    <button id="btnRedo" title="Refazer (Ctrl+Y)" disabled>Refazer</button>
    <button id="btnCopy">Copiar seleção</button>
    <button id="btnPaste">Colar seleção</button>
    <button id="btnClear" class="danger">Limpar tudo</button>
    <div class="theme-switch" id="themeSwitch" role="group" aria-label="Tema">
      <button type="button" data-theme-choice="light" title="Modo claro">Claro</button>
      <button type="button" data-theme-choice="dark" title="Modo escuro">Escuro</button>
      <button type="button" data-theme-choice="system" title="Seguir o sistema">Sistema</button>
    </div>
  </div>
</header>

<main>
  <div class="panel">
    <label class="visually-hidden" for="searchBox">Buscar disciplina, código, professor ou sigla</label>
    <input class="search" id="searchBox" placeholder="Buscar disciplina, código, professor ou sigla...">
    <div class="filter-row" role="group" aria-label="Filtrar disciplinas">
      <button id="filterAll" class="active" aria-pressed="true">Todas</button>
      <button id="filterSelected" aria-pressed="false">Selecionadas</button>
      <button id="filterConflict" aria-pressed="false">Com conflito</button>
    </div>
    <div class="subject-list" id="subjectList" aria-label="Lista de disciplinas"></div>
  </div>

  <div>
    <div class="stats" id="statsBar" role="status" aria-live="polite"></div>
    <div class="conflict-banner" id="conflictBanner" role="alert" aria-live="assertive"></div>
    <div class="grid-wrap">
      <table class="grid" id="gridTable"></table>
    </div>
    <div class="legend" id="legend" aria-label="Legenda de cores por disciplina"></div>
    <div class="footer-note">Dados extraídos do relatório "Turmas Abertas — 2º Semestre de 2026" (UTFPR, gerado 30/07/2026). Salas em <span class="dot-red">vermelho</span> indicam turmas em outra sede (Ecoville <span class="dot-red">*</span>  / Neoville <span class="dot-red">**</span> ). Sujeito a alteração, confira sempre no sistema oficial.</div>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<!-- Dados (disciplinas, dias, aulas, paleta) separados da lógica de aplicação -->
<script src="data.js"></script>
<!-- Lógica da aplicação (estado, renderização, eventos) -->
<script src="app.js"></script>
</body>
</html>
